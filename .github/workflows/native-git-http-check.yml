name: Isolated writer DNS and trusted TLS diagnosis
on:
  push:
    branches: [codex/native-git-http-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public DNS and test origin without credentials
        run: |
          python3 <<'PY'
          import json,urllib.request,urllib.error,hashlib
          from pathlib import Path
          result={'source':'Isolated test domain DNS and trusted TLS diagnosis','authenticatedFlowVerified':False}
          out=Path('proof-results');out.mkdir(exist_ok=True)
          for label,url in [('dns','https://dns.google/resolve?name=writer-test.aj.new.tg&type=CNAME'),('http','http://writer-test.aj.new.tg/author-probe/'),('https','https://writer-test.aj.new.tg/api/author/status'),('production','https://aj.new.tg/')]:
           try:
            with urllib.request.urlopen(url,timeout=25) as response:
             body=response.read()
             result[label]={'status':response.status,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()}
             if label in ('dns','https'):result[label]['data']=json.loads(body)
           except Exception as error:result[label]={'error':type(error).__name__,'reason':str(getattr(error,'reason',error))}
          result['passed']=result.get('https',{}).get('status')==200 and result.get('production',{}).get('sha256')=='2895daa842e3e30dffb2cb6d78dd475cb92c6d5fef7e2f46992336527e4e70c3'
          (out/'dns-tls-diagnosis.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          raise SystemExit(0 if result['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-publication-proof
          path: proof-results/
          retention-days: 1
