name: Isolated test connection baseline
on:
  push:
    branches: [codex/native-git-http-check]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare anonymous HTTP 1.1 static and function requests
        run: |
          python3 <<'PY'
          import subprocess,json,socket,datetime,pathlib,time
          out=pathlib.Path('proof-results');out.mkdir()
          result={'observedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'GitHub Ubuntu runner; anonymous curl HTTP/1.1; no automatic retries','dnsAddresses':sorted({a[4][0] for a in socket.getaddrinfo('writer-test.aj.new.tg',443,type=socket.SOCK_STREAM)}),'curlVersion':subprocess.run(['curl','--version'],capture_output=True,text=True).stdout.splitlines()[0],'checks':[]}
          for round in range(1,4):
           for route in ['/__publication_probe.json','/api/author/status']:
            run=subprocess.run(['curl','--disable','--silent','--show-error','--http1.1','--connect-timeout','5','--max-time','8','--header','Cookie:','--header','Authorization:','--header','Cache-Control: no-cache','--output','/dev/null','--write-out','%{json}','https://writer-test.aj.new.tg'+route],capture_output=True,text=True,timeout=12)
            value=json.loads(run.stdout)
            record={'observedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'round':round,'path':route,'exitCode':run.returncode,'status':value.get('http_code'),'error':value.get('errormsg'),'remoteIp':value.get('remote_ip'),'httpVersion':value.get('http_version'),'proxyUsed':value.get('proxy_used'),'dnsSeconds':value.get('time_namelookup'),'tcpSeconds':value.get('time_connect'),'tlsSeconds':value.get('time_appconnect'),'firstByteSeconds':value.get('time_starttransfer'),'totalSeconds':value.get('time_total'),'passed':run.returncode==0 and value.get('http_code')==200}
            result['checks'].append(record)
          result['passed']=all(r['passed'] for r in result['checks'])
          (out/'connection-cloud-baseline.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          raise SystemExit(0 if result['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connection-cloud-baseline
          path: proof-results/
          retention-days: 1
