name: Compare publication deployment and custom domain
on:
  push:
    branches: [codex/native-git-http-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact publication A from independent cloud network
        run: |
          python3 <<'PY'
          import urllib.request,urllib.error,json,hashlib,datetime
          from pathlib import Path
          expected='0203ed3d-63ff-49a8-b77f-b30363191de9'
          path='/publication-proof/articles/probe-60f968ca-2d49-456f-b4e1-7a64b0c3122e/'
          origins=['https://writer-test.aj.new.tg','https://aj-native-git-proof-20261016-dpi1d7vb2tyb.edgeone.dev','https://aj-native-git-proof-20261016-qbkyvyub.edgeone.dev']
          result={'observedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'GitHub Ubuntu runner anonymous HTTP','expectedReleaseId':expected,'checks':[]}
          for origin in origins:
           entry={'origin':origin}
           for label,route in [('marker','/__publication_probe.json'),('article',path)]:
            try:
             req=urllib.request.Request(origin+route,headers={'Cache-Control':'no-cache'})
             try:
              with urllib.request.urlopen(req,timeout=25) as r: status=r.status;body=r.read();headers=dict(r.headers)
             except urllib.error.HTTPError as e: status=e.code;body=e.read();headers=dict(e.headers)
             value={'status':status,'sha256':hashlib.sha256(body).hexdigest(),'lastModified':headers.get('Last-Modified'),'cache':headers.get('EO-Cache-Status')}
             if label=='marker' and status==200:
              marker=json.loads(body);value.update({'releaseId':marker.get('releaseId'),'articleCount':marker.get('articleCount'),'matches':marker.get('releaseId')==expected})
             if label=='article':
              value['containsA']=b'AJ_PUBLISH_PROBE_20261017_A' in body
              value['containsPrivateControl']=b'AJ_PRIVATE_PROBE_20261017_9C4A62' in body
             entry[label]=value
            except Exception as error:entry[label]={'error':type(error).__name__}
           result['checks'].append(entry)
          result['passed']=all(e.get('marker',{}).get('matches') and e.get('article',{}).get('containsA') and not e.get('article',{}).get('containsPrivateControl') for e in result['checks'])
          out=Path('proof-results');out.mkdir(exist_ok=True)
          (out/'publication-network-check.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          raise SystemExit(0 if result['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-network-check
          path: proof-results/
          retention-days: 1
