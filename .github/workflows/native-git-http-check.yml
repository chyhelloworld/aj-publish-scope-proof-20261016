name: Git writer isolation and unchanged-site checks
on:
  push:
    branches: [codex/native-git-http-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_WITHDRAW_RELEASE: e86dbd87-bb92-44d2-979a-e548230d2b3f
    steps:
      - name: Verify final public and private boundaries
        run: |
          python3 <<'PY'
          """Final anonymous checks after the Android withdrawal; no credentials or writes."""
          import concurrent.futures
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.request
          
          ORIGIN = 'https://writer-test.aj.new.tg'
          SOURCE_COMMIT = '217f30c5fb2a612a3a7de1f8f0a96f2f18f65ae4'
          PRODUCTION_HASH = '2895daa842e3e30dffb2cb6d78dd475cb92c6d5fef7e2f46992336527e4e70c3'
          expected_release = os.environ['EXPECTED_WITHDRAW_RELEASE']
          assert re.fullmatch(r'[a-f0-9-]{36}', expected_release)
          
          
          def read(url, cookie=''):
              headers = {'Cache-Control': 'no-cache'}
              if cookie:
                  headers['Cookie'] = cookie
              try:
                  response = urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.status, response.read(4 * 1024 * 1024), dict(response.headers)
          
          
          result = {'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'source': 'GitHub Ubuntu runner anonymous final boundary checks', 'automaticRetries': 0, 'actualCredentialsSupplied': False, 'sourceCommit': SOURCE_COMMIT, 'passed': False}
          try:
              code, body, _ = read('https://raw.githubusercontent.com/chyhelloworld/aj-publish-scope-proof-20261016/' + SOURCE_COMMIT + '/published-manifest.json')
              assert code == 200
              manifest = json.loads(body)
              original_files = [file for file in manifest['files'] if file['path'].endswith(('.html', '.xml'))]
              assert len(original_files) == 11
          
              def check_original(file):
                  assert re.fullmatch(r'[A-Za-z0-9_./-]+', file['path']) and '..' not in file['path']
                  status, data, _ = read(ORIGIN + '/' + file['path'])
                  expected_codes = (200, 404) if file['path'] == '404.html' else (200,)
                  digest = hashlib.sha256(data).hexdigest()
                  return {'path': file['path'], 'status': status, 'sha256': digest, 'passed': status in expected_codes and digest == file['sha256'] and b'AJ_PRIVATE_PROBE_20261017_9C4A62' not in data}
          
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  result['originalPublicFiles'] = list(pool.map(check_original, original_files))
              assert all(check['passed'] for check in result['originalPublicFiles'])
          
              result['privateEndpoints'] = []
              for path, cookie in [('/api/author/drafts/0ef9bc69-aaec-4b3c-8456-259b4402ed06', ''), ('/api/author/drafts/57b7682a-6e6c-4540-b34c-ac12a780ca6b', ''), ('/api/author/images/f8c56b3e-6425-4dce-917e-b2b92e1a1b9e', ''), ('/api/author/images/f8c56b3e-6425-4dce-917e-b2b92e1a1b9e', '__Host-author_probe_session=' + 'f'*64)]:
                  code, body, headers = read(ORIGIN + path, cookie)
                  payload = json.loads(body)
                  cache_control = next((value for key, value in headers.items() if key.lower() == 'cache-control'), '')
                  check = {'path': path, 'forgedSession': bool(cookie), 'status': code, 'errorOnly': set(payload) == {'error'}, 'privateNoStore': 'private' in cache_control and 'no-store' in cache_control}
                  check['passed'] = code == 401 and check['errorOnly'] and check['privateNoStore']
                  result['privateEndpoints'].append(check)
              assert all(check['passed'] for check in result['privateEndpoints'])
          
              code, body, _ = read(ORIGIN + '/api/author/public-snapshot')
              snapshot = json.loads(body)
              assert code == 200 and snapshot['releaseId'] == expected_release and not snapshot['articles'] and not snapshot['assets']
              code, body, _ = read(ORIGIN + '/__publication_probe.json')
              marker = json.loads(body)
              assert code == 200 and marker['releaseId'] == expected_release and not marker['slugs']
              result['withdrawal'] = {'releaseId': expected_release, 'publicArticles': 0, 'publicAssets': 0, 'staticMarkerMatched': True}
          
              code, body, _ = read('https://aj.new.tg/')
              digest = hashlib.sha256(body).hexdigest()
              result['production'] = {'status': code, 'sha256': digest, 'matchesBaseline': code == 200 and digest == PRODUCTION_HASH}
              assert result['production']['matchesBaseline']
              result['gitWriter'] = []
              for file, expected_hash in {"index.html":"767b6763c9185dcaace3bc93d7c89b4f2f547b7eefff4ccd9e4c087c11b55870","app.js":"531770f91a401e3aa4e212fc5002221860298e236e25be32cf9f9fb808ba02d3","style.css":"4c513758a25960eeff6aa79bbb0edf3de278510e6106f95cd4f26cf868e71025"}.items():
                  code, data, _ = read(ORIGIN + '/git-writer/' + file)
                  result['gitWriter'].append({'file': file, 'status': code, 'matches': code == 200 and hashlib.sha256(data).hexdigest() == expected_hash})
              assert all(check['matches'] for check in result['gitWriter'])
              result['gitPrivateEndpoints'] = []
              for path in ['/api/author/git-articles', '/api/author/git-articles/git-writer-cloud-20261018']:
                  code, data, headers = read(ORIGIN + path)
                  result['gitPrivateEndpoints'].append({'path': path, 'status': code})
                  assert code == 401
              code, _, _ = read(ORIGIN + '/articles/git-writer-cloud-20261018.md')
              assert code == 404
              result['passed'] = True
          except Exception as error:
              result['error'] = type(error).__name__ + ': ' + str(error)
          out = Path('proof-results')
          out.mkdir(exist_ok=True)
          (out/'git-writer-boundaries.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          raise SystemExit(0 if result['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-writer-boundaries
          path: proof-results/
          retention-days: 1
