name: Native Git boundary HTTP verification
on:
  push:
    branches: [codex/native-git-http-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify recovered-v3
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          (async()=>{
           const expected={"stage":"recovered-v3","version":3,"marker":"native-git-v3-recovered-20261016"};
           const origin="https://aj-native-git-proof-20261016-qbkyvyub.edgeone.dev";
           const nonce=process.env.GITHUB_RUN_ID+'-'+expected.stage;
           const [proofResponse,htmlResponse,productionResponse]=await Promise.all([
            fetch(origin+'/proof.json?boundary='+nonce,{signal:AbortSignal.timeout(20000)}),
            fetch(origin+'/?boundary='+nonce,{signal:AbortSignal.timeout(20000)}),
            fetch('https://aj.new.tg/',{signal:AbortSignal.timeout(20000)})
           ]);
           const proofText=await proofResponse.text();
           let proof;try{proof=JSON.parse(proofText);}catch{}
           const html=await htmlResponse.text();
           const productionHash=crypto.createHash('sha256').update(Buffer.from(await productionResponse.arrayBuffer())).digest('hex');
           const result={observedAt:new Date().toISOString(),expected,source:'GitHub hosted runner; HTTP only; no EdgeOne credential',proof:{status:proofResponse.status,marker:proof?.marker,version:proof?.version},homepage:{status:htmlResponse.status,expectedMarkerPresent:html.includes(expected.marker),nonpublishMarkerPresent:html.includes('NONPUBLISH_BRANCH_ONLY_20261016')},production:{status:productionResponse.status,sha256:productionHash,matchesBaseline:productionHash==='2895daa842e3e30dffb2cb6d78dd475cb92c6d5fef7e2f46992336527e4e70c3'}};
           result.passed=proofResponse.status===200&&proof?.marker===expected.marker&&proof?.version===expected.version&&htmlResponse.status===200&&result.homepage.expectedMarkerPresent&&!result.homepage.nonpublishMarkerPresent&&productionResponse.status===200&&result.production.matchesBaseline;
           fs.mkdirSync('proof-results',{recursive:true});
           fs.writeFileSync('proof-results/native-git-boundary-http.json',JSON.stringify(result,null,2));
           console.log(JSON.stringify(result));
           if(!result.passed)process.exitCode=1;
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-publication-proof
          path: proof-results/
          retention-days: 1
